name: ci
on: [push, pull_request]
jobs:
  vectors:
    name: conformance vectors against the reference verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Every vector's proof.json against the schema, and every expected.json against its own.
      - run: npm run validate
      # The committed corpus manifest must match vectors/ exactly (C19).
      - run: npm run manifest:check
      # The edge-case generator must still agree with the reference verifier.
      - run: npm run generate:edge-cases
